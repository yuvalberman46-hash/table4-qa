<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>שולחן 4 - שאלות ותשובות</title>
<meta name="description" content="שאלו כל שאלה על תוכן פרקי הפודקאסט שולחן 4, והקבלו תשובה מבוססת על התמלולים." />
<meta name="theme-color" content="#141414" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="שולחן 4" />
<style>
  :root {
    --bg: #141414;
    --panel: #1e1e1e;
    --panel-2: #262626;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #e8a33d;
    --accent-text: #141414;
    --border: #333333;
    --user-bubble: #2b4a5c;
    --answer-bubble: #262626;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  header {
    padding: 16px 16px calc(env(safe-area-inset-top, 0px) + 12px);
    padding-top: max(16px, env(safe-area-inset-top));
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 18px;
    margin: 0 0 2px;
  }

  header p {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    padding: 24px;
    max-width: 320px;
  }

  .empty-state .emoji {
    font-size: 40px;
    display: block;
    margin-bottom: 12px;
  }

  .qa-pair {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bubble {
    padding: 12px 14px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .question-bubble {
    background: var(--user-bubble);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    max-width: 85%;
  }

  .answer-bubble {
    background: var(--answer-bubble);
    align-self: stretch;
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }

  .answer-bubble.loading {
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  .source-chip {
    font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    text-decoration: none;
  }

  a.source-chip {
    color: var(--accent);
    cursor: pointer;
  }

  a.source-chip:hover {
    border-color: var(--accent);
  }

  .error-bubble {
    background: #4a2323;
    border: 1px solid #7a3a3a;
    color: #ffd6d6;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--border);
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
    min-height: 44px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>

<header>
  <h1>שולחן 4 - שאלות ותשובות</h1>
  <p>שאלו על כל מה שנאמר בפרקי הפודקאסט</p>
</header>

<main id="chat">
  <div class="empty-state" id="emptyState">
    <span class="emoji">🎙️</span>
    <div>שאלו כל שאלה על תוכן הפרקים - למשל "אילו ספרים הומלצו?" או "מה נאמר על יזמות?"</div>
  </div>
</main>

<form id="askForm">
  <textarea id="questionInput" placeholder="הקלידו שאלה..." rows="1" required></textarea>
  <button type="submit" id="sendButton">שלח</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const emptyState = document.getElementById("emptyState");
  const form = document.getElementById("askForm");
  const input = document.getElementById("questionInput");
  const sendButton = document.getElementById("sendButton");

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    if (emptyState) emptyState.remove();

    const pair = document.createElement("div");
    pair.className = "qa-pair";

    const qBubble = document.createElement("div");
    qBubble.className = "bubble question-bubble";
    qBubble.textContent = question;
    pair.appendChild(qBubble);

    const aBubble = document.createElement("div");
    aBubble.className = "bubble answer-bubble loading";
    aBubble.innerHTML = '<span class="spinner"></span><span>מחפש בפרקים ומנסח תשובה...</span>';
    pair.appendChild(aBubble);

    chat.appendChild(pair);
    chat.scrollTop = chat.scrollHeight;

    input.value = "";
    input.style.height = "auto";
    sendButton.disabled = true;

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.detail || "שגיאה בשרת");
      }

      const data = await res.json();
      aBubble.classList.remove("loading");
      aBubble.innerHTML = escapeHtml(data.answer).replace(/\n/g, "<br>");

      if (data.sources && data.sources.length) {
        const sourcesDiv = document.createElement("div");
        sourcesDiv.className = "sources";
        data.sources.forEach((s) => {
          const label = s.timestamp ? `${s.episode_title} · ${s.timestamp}` : s.episode_title;
          let chip;
          if (s.url) {
            chip = document.createElement("a");
            chip.href = s.url;
            chip.target = "_blank";
            chip.rel = "noopener noreferrer";
          } else {
            chip = document.createElement("span");
          }
          chip.className = "source-chip";
          chip.textContent = label;
          sourcesDiv.appendChild(chip);
        });
        aBubble.appendChild(sourcesDiv);
      }
    } catch (err) {
      aBubble.classList.remove("loading");
      aBubble.classList.add("error-bubble");
      aBubble.textContent = "משהו השתבש: " + err.message;
    } finally {
      sendButton.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
  }
</script>

</body>
</html>
